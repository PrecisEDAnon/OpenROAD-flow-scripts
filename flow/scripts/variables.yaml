---
GENERATE_ARTIFACTS_ON_FAILURE:
  description: >
    For instance Bazel needs artifacts (.odb and .rpt files) on a failure to
    allow the user to save hours on re-running the failed step locally, but when
    working with a Makefile flow, it is more natural to fail the step and leave
    the user to manually inspect the logs and artifacts directly via the file
    system.
    Set to 1 to change the behavior to generate artifacts upon failure to e.g.
    do a global route. The exit code will still be non-zero on all other
    failures that aren't covered by the "useful to inspect the artifacts on
    failure" use-case.
    Example: just like detailed routing, a global route that fails with
    congestion, is not a build failure(as in exit code non-zero), it is a
    successful(as in zero exit code) global route that produce reports
    detailing the problem.
    Detailed route will not proceed, if there is global routing congestion
    This allows build systems, such as bazel, to create artifacts for global and
    detailed route, even if the operation had problems, without having know
    about the semantics between global and detailed route.
    Considering that global and detailed route can run for a long time and use a
    lot of memory, this allows inspecting results on a laptop for a build that
    ran on a server.
  default: 0
TNS_END_PERCENT:
  description: >
    Default TNS_END_PERCENT value for post CTS timing repair. Try fixing all
    violating endpoints by default (reduce to 5% for runtime).
    Specifies how many percent of violating paths to fix [0-100]. Worst path
    will always be fixed.
  default: 100
  stages:
    - place
    - cts
    - floorplan
    - grt
ROUTING_LAYER_ADJUSTMENT:
  default: 0.5
  description: >
    Adjusts routing layer capacities to manage congestion and
    improve detailed routing. High values ease detailed routing
    but risk excessive detours and long global routing times,
    while low values reduce global routing failure but can
    complicate detailed routing.
    The global routing running time normally reduces
    dramatically (entirely design specific, but going from hours to
    minutes has been observed) when the value is
    low (such as 0.10).
    Sometimes, global routing will succeed with lower values and
    fail with higher values. Exploring results with different
    values can help shed light on the problem. Start with
    a too low value, such as 0.10, and bisect
    to value that works by doing multiple global routing runs.
    As a last resort, `make global_route_issue` and using
    the tools/OpenROAD/etc/deltaDebug.py can be useful to debug
    global routing errors. If there is something specific that is
    impossible to route, such as a clock line over a macro, global
    routing will terminate with DRC errors routes that could
    have been routed were it not for the specific impossible routes.
    deltaDebug.py should weed out the possible routes and leave
    a minimal failing case that pinpoints the problem.
  stages:
    - floorplan
    - place
    - grt
    - route
    - final
RECOVER_POWER:
  description: >
    Specifies how many percent of paths with positive slacks can be slowed for
    power savings [0-100].
  default: 0
SKIP_INCREMENTAL_REPAIR:
  default: 0
  description: >
    Skip incremental repair in global route.
  stages:
    - grt
DETAILED_METRICS:
  description: >
    If set, then calls report_metrics prior to repair operations in the CTS
    and global route stages
  default: 0
  stages:
    - cts
    - grt
EQUIVALENCE_CHECK:
  description: >
    Enable running equivalence checks to verify logical correctness of
    repair_timing.
  default: 0
  stages:
    - cts
CORE_UTILIZATION:
  description: |
    The core utilization percentage (0-100).
  stages:
    - floorplan
  tunable: 1
  type: float
CORE_AREA:
  description: >
    The core area specified as a list of lower-left and upper-right corners in
    microns
    (X1 Y1 X2 Y2).
  stages:
    - floorplan
  tunable: 1
REPORT_CLOCK_SKEW:
  description: >
    Report clock skew as part of reporting metrics, starting at CTS, before which
    there is no clock skew.
    This metric can be quite time-consuming, so it can be useful to disable.
  stages:
    - cts
    - grt
    - route
    - final
  default: 1
SKIP_REPORT_METRICS:
  description: >
    If set to 1, then metrics, report_metrics does nothing. Useful to speed up
    builds.
  stages:
    - floorplan
    - place
    - cts
    - grt
    - route
    - final
  default: 0
PROCESS:
  description: |
    Technology node or process in use.
CORNER:
  description: >
    PVT corner library selection. Only available for ASAP7 and GF180 PDKs.
TECH_LEF:
  description: >
    A technology LEF file of the PDK that includes all relevant information
    regarding metal layers, vias, and spacing requirements.
SC_LEF:
  description: |
    Path to technology standard cell LEF file.
GDS_FILES:
  description: |
    Path to platform GDS files.
LIB_FILES:
  description: >
    A Liberty file of the standard cell library with PVT characterization,
    input and output characteristics, timing and power definitions for each
    cell.
PLATFORM_TCL:
  description: |
    Specifies a Tcl script with commands to run before loading design.
DONT_USE_CELLS:
  description: |
    Dont use cells eases pin access in detailed routing.
SYNTH_GUT:
  description: >
    Load design and remove all internal logic before doing synthesis. This is
    useful when creating a mock .lef abstract that has a smaller area than the
    amount of logic would allow. bazel-orfs uses this to mock SRAMs, for
    instance.
  stages:
    - synth
  default: 0
SYNTH_HIERARCHICAL:
  description: |
    Enable to Synthesis hierarchically, otherwise considered flat synthesis.
  stages:
    - synth
  default: 0
SYNTH_MEMORY_MAX_BITS:
  description: >
    Maximum number of bits for memory synthesis.

    Ideally, real RAM or realistic fakeram should be used for RAMs
    much larger than 1024 bits.

    To temporarily ignore the RAM concerns and investigate other
    aspects of the design, consider setting `SYNTH_MOCK_LARGE_MEMORIES=1`,
    or adjusting `SYNTH_MEMORY_MAX_BITS`.
  default: 4096
  stages:
    - synth
SYNTH_MOCK_LARGE_MEMORIES:
  description: >
    Reduce Yosys inferred memories larger than SYNTH_MEMORY_MAX_BITS to 1 row.

    Yosys will generally infer memories from behavioral Verilog code, whether
    the memories are in standalone modules or instantiated within some
    larger module.

    fakeram and empty Verilog memories(blackboxes) of memories will not
    be inferred memories by Yosys and are therefore not affected by
    this variable.

    This is useful and convenient to separate the concern of instantiating
    and placing memories from investigating other issues with a design,
    though it comes at the expense of the increased accuracy that using
    realistic fakemem would provide.

    Memories with a single 1 row will of course have unrealistically good
    timing and area characteristics, but timing will still correctly terminate
    in a register.

    Large port memories, typically register files, will still have the
    retain a lot of the port logic that can be useful to investigate issues.

    This can be especially useful during development of designs where the
    behavioral model comes first and suitable memories are matched up
    when the design RTL is stable.

    A typical use case would be Chisel which will generate a behavioral model
    for a memories with the required clocks, ports, etc. in addition to a
    computer readable file with the specification of the memories that
    is used to
    [automatically](https://chipyard.readthedocs.io/en/stable/Tools/Barstools.html/)
    match up suitable memory macros later in the flow.

    During an architectural screening study, a large range of memory
    configurations can be investigated quickly with this option,
    without getting bogged down in the concern of how to realize the
    memories in silicon for emphemral RTL configurations that exist
    only long enough to run through the ORFS flow to create a table
    of some characteristics of a design configuration.
  default: 0
  stages:
    - synth
SYNTH_KEEP_MOCKED_MEMORIES:
  description: >
    When `SYNTH_MOCK_LARGE_MEMORIES=1`, setting this to 1,
    will keep mocked memories (not flattening them).

    This preserves some of the access logic complexity and
    avoids optimizations outside of the mocked memory.
  default: 1
  stages:
    - synth
SYNTH_HDL_FRONTEND:
  description: >
    Select an alternative language frontend to ingest the design. Available option
    is "slang". If the variable is empty, design is read with the Yosys read_verilog
    command.
  stages:
    - synth
SYNTH_SLANG_ARGS:
  description: >
    Additional arguments passed to the slang frontend during synthesis.
  stages:
    - synth
  default: ""
SYNTH_BLACKBOXES:
  description: >
    List of cells treated as a black box by Yosys. With Bazel, this can be used
    to run synthesis in parallel for the large modules of the design.
  stages:
    - synth
SYNTH_NETLIST_FILES:
  description: >
    Skips synthesis and uses the supplied netlist files. If the netlist files
    contains duplicate modules, which can happen when using hierarchical
    synthesis on indvidual netlist files and combining here,
    subsequent modules are silently ignored and only the first module is used.
  stages:
    - synth
SYNTH_CANONICALIZE_TCL:
  description: >
    Specifies a Tcl script with commands to run as part of the synth
    canonicalize step.
  stages:
    - synth
SYNTH_RETIME_MODULES:
  description: >
    *This is an experimental option and may cause adverse effects.*
    *No effort has been made to check if the retimed RTL is logically equivalent
    to the non-retimed RTL.*

    List of modules to apply automatic retiming to. These modules must not get
    dissolved and as such they should either be the top module or be included
    in SYNTH_KEEP_MODULES.

    The main use case is to quickly identify if performance can be improved by
    manually retiming the input RTL.

    Retiming will treat module ports like register endpoints/startpoints.
    The objective function of retiming isn't informed by SDC, even the clock
    period is ignored. As such, retiming will optimize for best delay
    at potentially high register number cost. Automatic retiming can produce
    suboptimal results as its timing model is crude and it doesn't find the
    optimal distribution of registers on long pipelines. See OR discussion #8080.
  stages:
    - synth
DFF_MAP_FILE:
  description: |
    Optional mapping file supplied to Yosys to map D flip-flops
  stages:
    - synth
LATCH_MAP_FILE:
  description: |
    Optional mapping file supplied to Yosys to map latches
  stages:
    - synth
CLKGATE_MAP_FILE:
  description: |
    Optional mapping file supplied to Yosys to map clock gating cells
  stages:
    - synth
ADDER_MAP_FILE:
  description: |
    Optional mapping file supplied to Yosys to map adders
  stages:
    - synth
TIEHI_CELL_AND_PORT:
  description: >
    Tie high cells used in Yosys synthesis to replace a logical 1 in the
    Netlist.
  stages:
    - synth
    - floorplan
TIELO_CELL_AND_PORT:
  description: |
    Tie low cells used in Yosys synthesis to replace a logical 0 in the Netlist.
  stages:
    - synth
    - floorplan
TIE_SEPARATION:
  description: |
    Distance separating tie high/low instances from the load.
  stages:
    - floorplan
  default: 0
EARLY_SIZING_CAP_RATIO:
  description: |
    Ratio between the input pin capacitance and the output pin load during initial gate sizing.
  stages:
    - place
MIN_BUF_CELL_AND_PORTS:
  description: |
    Used to insert a buffer cell to pass through wires. Used in synthesis.
  stages:
    - synth
    - grt
ABC_CLOCK_PERIOD_IN_PS:
  description: >
    Clock period to be used by STA during synthesis. Default value read from
    `constraint.sdc`.
  stages:
    - synth
ABC_DRIVER_CELL:
  description: |
    Default driver cell used during ABC synthesis.
  stages:
    - synth
ABC_LOAD_IN_FF:
  description: |
    During synthesis set_load value used.
  stages:
    - synth
SYNTH_MINIMUM_KEEP_SIZE:
  description: >
    For hierarchical synthesis, we keep modules of larger area than given by
    this variable and flatten smaller modules.
    The area unit used is the size of a basic nand2 gate from the
    platform's standard cell library. The default value is platform specific.
  stages:
    - synth
  default: 0
SYNTH_WRAPPED_OPERATORS:
  description: >
    Synthesize multiple architectural options for each arithmetic operator in the
    design. These options are available for switching among in later stages of
    the flow.
  stages:
    - All stages
SYNTH_WRAPPED_ADDERS:
  description: >
    Specify the adder modules that can be used for synthesis, separated by commas.
    The default adder module is determined by the first element of this variable.
  stages:
    - synth
SYNTH_WRAPPED_MULTIPLIERS:
  description: >
    Specify the multiplier modules that can be used for synthesis, separated by commas.
    The default multiplier module is determined by the first element of this variable.
  stages:
    - synth
SWAP_ARITH_OPERATORS:
  description: >
    Improve timing QoR by swapping ALU and MULT arithmetic operators.
  stages:
    - All stages
FLOORPLAN_DEF:
  description: |
    Use the DEF file to initialize floorplan. Mutually exclusive with FOOTPRINT or DIE_AREA/CORE_AREA or CORE_UTILIZATION.
  stages:
    - floorplan
    - place
DONT_BUFFER_PORTS:
  description: >
    Do not buffer input/output ports during floorplanning.
  stages:
    - place
  default: 0
BUFFER_PORTS_ARGS:
  description: >
    Specify arguments to the buffer_ports call during placement. Only used if DONT_BUFFER_PORTS=0.
  stages:
    - place
REMOVE_ABC_BUFFERS:
  description: >
    Remove abc buffers from the netlist. If timing repair in floorplanning is
    taking too long, use a SETUP/HOLD_SLACK_MARGIN to terminate timing repair early
    instead of using REMOVE_ABC_BUFFERS or set SKIP_LAST_GASP=1.
  stages:
    - floorplan
  deprecated: 1
  default: 0
BALANCE_ROWS:
  description: |
    Balance rows during placement.
  stages:
    - place
  default: 0
PLACE_SITE:
  description: |
    Placement site for core cells defined in the technology LEF file.
  stages:
    - floorplan
  type: string
  tunable: 1
LAYER_PARASITICS_FILE:
  description: |
    Path to per layer parasitics file. Defaults to $(PLATFORM_DIR)/setRC.tcl.
  type: string
TAPCELL_TCL:
  description: |
    Path to Endcap and Welltie cells file.
  stages:
    - floorplan
MACRO_PLACEMENT_TCL:
  description: |
    Specifies the path of a TCL file on how to place macros manually.
    The user may choose to place just some of the macros in the design.
    The macro placer will handle the remaining unplaced macros.
  stages:
    - floorplan
MACRO_PLACE_HALO:
  description: >
    Horizontal/vertical halo around macros (microns). Used by automatic macro
    placement.
  stages:
    - floorplan
MACRO_BLOCKAGE_HALO:
  description: >
    Distance beyond the edges of a macro that will also be covered by the
    blockage generated for that macro.
    Note that the default macro blockage halo comes from the largest of the
    specified MACRO_PLACE_HALO x or y values. This variable overrides that
    calculation.
  stages:
    - floorplan
PDN_TCL:
  description: >
    File path which has a set of power grid policies used by pdn to be applied
    to the design, such as layers to use, stripe width and spacing to generate
    the actual metal straps.
  stages:
    - floorplan
MAKE_TRACKS:
  description: |
    Tcl file that defines add routing tracks to a floorplan.
  stages:
    - floorplan
IO_CONSTRAINTS:
  description: |
    File path to the IO constraints .tcl file. Also used for manual placement.
  stages:
    - floorplan
IO_PLACER_H:
  description: >
    A list of metal layers on which the I/O pins are placed horizontally (top and bottom
    of the die).
  stages:
    - floorplan
    - place
    - grt
IO_PLACER_V:
  description: >
    A list of metal layers on which the I/O pins are placed vertically (sides of the
    die).
  stages:
    - floorplan
    - place
    - grt
GUI_TIMING:
  description: >
    Load timing information when opening GUI. For large designs, this can be
    quite time consuming. Useful to disable when investigating non-timing
    aspects like floorplan, placement, routing, etc.
  default: 1
FILL_CELLS:
  description: >
    Fill cells are used to fill empty sites. If not set or empty, fill cell
    insertion is skipped.
  stages:
    - route
TAP_CELL_NAME:
  description: |
    Name of the cell to use in tap cell insertion.
CELL_PAD_IN_SITES_GLOBAL_PLACEMENT:
  description: >
    Cell padding on both sides in site widths to ease routability during global
    placement.
  stages:
    - place
    - floorplan
  default: 0
  type: int
  tunable: 1
CELL_PAD_IN_SITES_DETAIL_PLACEMENT:
  description: >
    Cell padding on both sides in site widths to ease routability in detail
    placement.
  stages:
    - place
    - cts
    - grt
  default: 0
  type: int
  tunable: 1
PLACE_PINS_ARGS:
  description: |
    Arguments to place_pins
  stages:
    - place
PLACE_DENSITY:
  description: >
    The desired average placement density of cells: 1.0 = dense, 0.0 = widely spread.

    The intended effort is also communicated by this parameter. Use a low value for faster builds and higher value for better quality of results.

    If a too low value is used, the placer will not be able to place all cells and a recommended minimum placement density can be found in the logs.

    A too high value can lead to excessive runtimes, even timeouts and subtle failures in the flow after placement, such as in CTS or global routing when timing repair fails.

    The default is platform specific.
  stages:
    - floorplan
    - place
PLACE_DENSITY_LB_ADDON:
  description: >
    Check the lower boundary of the PLACE_DENSITY and add
    PLACE_DENSITY_LB_ADDON if it exists.
  stages:
    - floorplan
    - place
  tunable: 1
  type: float
REPAIR_PDN_VIA_LAYER:
  description: |
    Remove power grid vias which generate DRC violations after detailed routing.
GLOBAL_PLACEMENT_ARGS:
  description: >
    Use additional tuning parameters during global placement other than default
    args defined in global_place.tcl.
ENABLE_DPO:
  description: |
    Enable detail placement with improve_placement feature.
  default: 1
DPO_MAX_DISPLACEMENT:
  description: |
    Specifies how far an instance can be moved when optimizing.
  default: 5 1
GPL_TIMING_DRIVEN:
  description: |
    Specifies whether the placer should use timing driven placement.
  stages:
    - place
  default: 1
GPL_ROUTABILITY_DRIVEN:
  description: |
    Specifies whether the placer should use routability driven placement.
  stages:
    - place
  default: 1
CAP_MARGIN:
  description: >
    Specifies a capacitance margin when fixing max capacitance violations. This
    option allows you to overfix.
SLEW_MARGIN:
  description: >
    Specifies a slew margin when fixing max slew violations. This option allows
    you to overfix.
CTS_ARGS:
  description: |
    Override `clock_tree_synthesis` arguments.
  stages:
    - cts
CTS_SNAPSHOTS:
  description: |
    Create ODB/SDC files at different stages of CTS.
  stages:
    - cts
  default: 0
HOLD_SLACK_MARGIN:
  description: >
    Specifies a time margin for the slack when fixing hold violations.
    This option allows you to overfix or underfix (negative value, terminate
    retiming before 0 or positive slack).
    floorplan.tcl uses min of HOLD_SLACK_MARGIN and 0 (default hold slack margin).
    This avoids overrepair in floorplan for hold by default, but allows skipping
    hold repair using a negative HOLD_SLACK_MARGIN.
    Exiting timing repair early is useful in exploration where
    the .sdc has a fixed clock period at the design's target clock period and where
    HOLD/SETUP_SLACK_MARGIN is used to avoid overrepair (extremely long running
    times) when exploring different parameter settings.
    When an ideal clock is used, that is before CTS,
    a clock insertion delay of 0 is used in timing paths. This creates
    a mismatch between macros that have a .lib file from after CTS, when
    the clock is propagated. To mitigate this, OpenSTA will use subtract
    the clock insertion delay of macros when calculating timing with ideal
    clock. Provided that min_clock_tree_path
    and max_clock_tree_path are in the .lib file, which is the case for
    macros built with OpenROAD. This is less accurate than if OpenROAD had
    created a placeholder clock tree for timing estimation purposes
    prior to CTS.
    There will inevitably be inaccuracies in the timing calculation prior
    to CTS. Use a slack margin that is low enough, even negative, to
    avoid overrepair. Inaccuracies in the timing prior to CTS can also
    lead to underrepair, but there no obvious and simple way to avoid
    underrapir in these cases.
    Overrepair can lead to excessive runtimes in repair or too much buffering
    being added, which can present itself as congestion of hold cells or
    buffer cells.
    Another use of SETUP/HOLD_SLACK_MARGIN is design parameter exploration
    when trying to find the minimum clock period for a design.
    The SDC_FILE for a design can be quite complicated and instead of
    modifying the clock period in the SDC_FILE, which can be non-trivial,
    the clock period can be fixed at the target frequency and the
    SETUP/HOLD_SLACK_MARGIN can be swept to find a plausible
    current minimum clock period.
  stages:
    - cts
    - floorplan
    - grt
  default: 0
SETUP_SLACK_MARGIN:
  description: |
    Specifies a time margin for the slack when fixing setup violations.
    This option allows you to overfix or underfix(negative value, terminate
    retiming before 0 or positive slack).
    See HOLD_SLACK_MARGIN for more details.
  stages:
    - cts
    - floorplan
    - grt
  default: 0
SETUP_REPAIR_SEQUENCE:
  description: |
    Specifies the sequence of moves to do in repair_timing -setup. This should be a string
    of move keywords separated by commas such as the default when not used:
    "unbuffer,sizedown,sizeup,swap,buffer,clone,split".
  stages:
    - cts
    - floorplan
    - grt
SKIP_GATE_CLONING:
  description: >
    Do not use gate cloning transform to fix timing violations (default: use
    gate cloning).
  stages:
    - cts
    - floorplan
    - grt
SKIP_LAST_GASP:
  description: >
    Do not use last gasp optimization to fix timing violations (default: use
    gate last gasp).
  stages:
    - cts
    - floorplan
    - grt
SKIP_PIN_SWAP:
  description: >
    Do not use pin swapping as a transform to fix timing violations (default:
    use pin swapping).
  stages:
    - cts
    - floorplan
    - grt
SKIP_VT_SWAP:
  description: >
    Do not perform VT swap to improve QoR (default: do VT swap).
  stages:
    - cts
    - floorplan
    - grt
SKIP_CRIT_VT_SWAP:
  description: >
    Do not perform VT swap on critical cells to improve QoR (default: do critical VT swap).
    This is an additional VT swap on critical cells that remain near the end of setup fixing.
    If SKIP_VT_SWAP is set to 1, this also disables critical cell VT swap.
  stages:
    - cts
    - floorplan
    - grt
REMOVE_CELLS_FOR_EQY:
  description: >
    String patterns directly passed to write_verilog -remove_cells <> for
    equivalence checks.
  stages:
    - cts
SKIP_CTS_REPAIR_TIMING:
  description: >
    Skipping CTS repair, which can take a long time, can be useful in
    architectural exploration or when getting CI up and running.
  stages:
    - cts
  default: 0
SKIP_REPAIR_TIE_FANOUT:
  description: >
    Skip repair_tie_fanout at floorplan step.
  stages:
    - floorplan
  default: 0
MIN_ROUTING_LAYER:
  description: |
    The lowest metal layer name to be used in routing.
  stages:
    - floorplan
    - place
    - grt
    - route
    - final
MAX_ROUTING_LAYER:
  description: |
    The highest metal layer name to be used in routing.
  stages:
    - floorplan
    - place
    - grt
    - route
    - final
DETAILED_ROUTE_ARGS:
  description: |
    Add additional arguments for debugging purposes during detail route.
  stages:
    - route
MACRO_EXTENSION:
  description: |
    Sets the number of GCells added to the blockages boundaries from macros.
DETAILED_ROUTE_END_ITERATION:
  description: >
    Maximum number of iterations.
  default: 64
  stages:
    - route
RCX_RULES:
  description: |
    RC Extraction rules file path.
SET_RC_TCL:
  description: |
    Metal & Via RC definition file path.
FILL_CONFIG:
  description: |
    JSON rule file for metal fill during chip finishing.
KLAYOUT_TECH_FILE:
  description: |
    A mapping from LEF/DEF to GDS using the KLayout tool.
IR_DROP_LAYER:
  description: |
    Default metal layer to report IR drop.
PLATFORM:
  required: true
  description: |
    Specifies process design kit or technology node to be used.
DESIGN_NAME:
  required: true
  description: |
    The name of the top-level module of the design.
VERILOG_FILES:
  required: true
  description: >
    The path to the design Verilog/SystemVerilog files providing a description
    of modules.
  stages:
    - synth
VERILOG_DEFINES:
  description: >
    Preprocessor defines passed to the language frontend.
    Example: `-D HPDCACHE_ASSERT_OFF`
  stages:
    - synth
SDC_FILE:
  required: true
  description: |
    The path to design constraint (SDC) file.
  stages:
    - synth
SDC_GUT:
  description: >
    Load design and remove all internal logic before doing synthesis. This is
    useful when creating a mock .lef abstract that has a smaller area than the
    amount of logic would allow. bazel-orfs uses this to mock SRAMs, for
    instance.
  stages:
    - synth
ADDITIONAL_FILES:
  description: |
    Additional files to be added to `make issue` archive.
ADDITIONAL_LEFS:
  description: >
    Hardened macro LEF view files listed here. The LEF information of the
    macros is immutable and used throughout all stages. Stored in the .odb file.
ADDITIONAL_LIBS:
  description: >
    Hardened macro library files listed here. The library information is
    immutable and used throughout all stages. Not stored in the .odb file.
ADDITIONAL_GDS:
  description: |
    Hardened macro GDS files listed here.
  stages:
    - final
VERILOG_INCLUDE_DIRS:
  description: |
    Specifies the include directories for the Verilog input files.
  stages:
    - synth
DESIGN_NICKNAME:
  description: >
    DESIGN_NICKNAME just changes the directory name that ORFS outputs to be
    DESIGN_NICKNAME instead of DESIGN_NAME in case DESIGN_NAME is unwieldy or
    conflicts with a different design.
ABC_AREA:
  description: |
    Strategies for Yosys ABC synthesis: Area/Speed. Default ABC_SPEED.
  stages:
    - synth
  default: 0
PWR_NETS_VOLTAGES:
  description: |
    Used for IR Drop calculation.
  stages:
    - final
GND_NETS_VOLTAGES:
  description: |
    Used for IR Drop calculation.
  stages:
    - final
BLOCKS:
  description: >
    Blocks used as hard macros in a hierarchical flow. Do note that you have to
    specify block-specific inputs file in the directory mentioned by Makefile.
CDL_FILES:
  description: |
    Insert additional Circuit Description Language (`.cdl`) netlist files.
DFF_LIB_FILES:
  description: |
    Technology mapping liberty files for flip-flops.
SYNTH_KEEP_MODULES:
  description: |
    Mark modules to keep from getting removed in flattening.
  stages:
    - synth
SYNTH_ARGS:
  description: |
    Optional synthesis variables for yosys.
SYNTH_HIER_SEPARATOR:
  description: |
    Separator used for the synthesis flatten stage.
  default: .
SYNTH_OPT_HIER:
  description: |
    Optimize constants across hierarchical boundaries.
  stages:
    - synth
VERILOG_TOP_PARAMS:
  description: |
    Apply toplevel params (if exist). Passed in as a list of key value pairs
    in tcl syntax; separated by spaces: PARAM1 VALUE1 PARAM2 VALUE2
  stages:
    - synth
CORE_ASPECT_RATIO:
  description: >
    The core aspect ratio (height / width). This value is ignored if
    `CORE_UTILIZATION` is undefined.
  stages:
    - floorplan
  default: 1.0
  tunable: 1
  type: float
CORE_MARGIN:
  description: >
    The margin between the core area and die area, specified in microns.
    Allowed values are either one value for all margins or a set of four
    values, one for each margin. The order of the four values are:
    `{bottom top left right}`. This variable is ignored if `CORE_UTILIZATION`
    is undefined.
  stages:
    - floorplan
  default: 1.0
  tunable: 1
  type: float
DIE_AREA:
  description: >
    The die area specified as a list of lower-left and upper-right corners in
    microns
    (X1 Y1 X2 Y2).
  stages:
    - floorplan
  tunable: 1
MACRO_ROWS_HALO_X:
  description: >
    Horizontal distance between the edge of the macro and the beginning of the
    rows created by tapcell. Only available for ASAP7 PDK and GF180/uart-blocks
    design.
  stages:
    - floorplan
MACRO_ROWS_HALO_Y:
  description: >
    Vertical distance between the edge of the macro and the beginning of the
    rows created by tapcell. Only available for ASAP7 PDK and GF180/uart-blocks
    design.
  stages:
    - floorplan
MACRO_WRAPPERS:
  description: |
    The wrapper file that replaces existing macros with their wrapped version.
  stages:
    - floorplan
CTS_BUF_DISTANCE:
  description: |
    Distance (in microns) between buffers.
  stages:
    - cts
  tunable: 1
  type: float
CTS_BUF_LIST:
  description: |
    List of cells used to construct the clock tree. Overrides buffer inference.
  stages:
    - cts
CLUSTER_FLOPS:
  description: >
    Minimum number of flip-flops per sink cluster.
  stages:
    - place
  default: 0
CTS_CLUSTER_DIAMETER:
  description: >
    Maximum diameter (in microns) of sink cluster.
  stages:
    - cts
  tunable: 1
  type: float
CTS_CLUSTER_SIZE:
  description: >
    Maximum number of sinks per cluster.
  stages:
    - cts
  tunable: 1
  type: int
CTS_LIB_NAME:
  description: |
    Name of the Liberty library to use in selecting the clock buffers.
  stages:
    - cts
CTS_SNAPSHOT:
  description: |
    Creates ODB/SDC files prior to clock net and setup/hold repair.
  stages:
    - cts
POST_CTS_TCL:
  description: |
    Specifies a Tcl script with commands to run after CTS is completed.
  stages:
    - cts
POST_FLOORPLAN_TCL:
  description: |
    Specifies a Tcl script with commands to run after floorplan is completed
    (before writing `2_1_floorplan.odb`).
  stages:
    - floorplan
DFT_ENABLE:
  description: >
    Enable ORFS DFT/scan insertion using the built-in hook scripts. When set,
    defaults `POST_FLOORPLAN_TCL` and `PRE_GLOBAL_ROUTE_TCL` to the ORFS DFT hook
    scripts unless they are already set.
  default: 0
  stages:
    - All stages
DFT_ROUTE_AWARE:
  description: >
    When `DFT_ENABLE=1`, enable trial-route-aware scan ordering by deferring scan
    stitching until after the first global route (uses `POST_GLOBAL_ROUTE_TCL`
    and sets `DFT_DEFER_STITCH=1`). Defaults `DFT_SCAN_ORDER_METRIC=PIN_TO_NET`
    unless it is already set.
  default: 0
  stages:
    - All stages
DFT_CLOCK_MIXING:
  description: >
    How scan architect mixes scan flops across clock domains.
    Pass-through to `set_dft_config -clock_mixing` (`clock_mix` or `no_mix`).
  default: no_mix
  stages:
    - floorplan
    - grt
DFT_POLARITY_MODE:
  description: >
    How scan architect handles mixed clock-edge polarity within each chain.
    Pass-through to `set_dft_config -polarity_mode` (`mid` or `strict`).
  default: strict
  stages:
    - floorplan
    - grt
DFT_CHAIN_COUNT:
  description: >
    Exact number of scan chains to generate (pass-through to
    `set_dft_config -chain_count`).
  stages:
    - floorplan
    - grt
DFT_MAX_CHAINS:
  description: >
    Maximum number of scan chains to generate (pass-through to
    `set_dft_config -max_chains`).
  stages:
    - floorplan
    - grt
DFT_MAX_CHAIN_LENGTH:
  description: >
    Maximum number of scan bits per chain (pass-through to
    `set_dft_config -max_length`).
  stages:
    - floorplan
    - grt
DFT_MAX_LENGTH:
  description: >
    Alias for `DFT_MAX_CHAIN_LENGTH` (pass-through to `set_dft_config -max_length`).
  stages:
    - floorplan
    - grt
DFT_SCAN_ORDER_METRIC:
  description: >
    Metric for ordering scan cells within each chain. `PLACEMENT` uses cell-to-cell
    Manhattan distance. `PIN_TO_NET` uses pin-to-net distance to global-route guides
    (or detailed routes when present), falling back to placement distance.
  stages:
    - floorplan
    - grt
DFT_SCAN_ORDER_SOLVER:
  description: >
    OpenROAD internal scan ordering solver used when `DFT_SCAN_SOLVER=openroad`.
    Pass-through to `set_dft_config -scan_order_solver` (`HEURISTIC`, `SCANOPT`,
    `ILS`). `SCANOPT` uses the UCLA ScanOptpack reference solver (`PLACEMENT`
    only). `ILS` selects the OpenROAD in-tree local search solver (also used as
    fallback for `PIN_TO_NET`).
  default: SCANOPT
  stages:
    - floorplan
    - grt
DFT_SCANOPT_ROUNDS:
  description: >
    Iterated local-search rounds for OpenROAD `-scan_order_solver SCANOPT`
    (pass-through to `set_dft_config -scanopt_rounds`).
  default: 500000
  stages:
    - floorplan
    - grt
DFT_SCANOPT_SEED:
  description: >
    Random seed for OpenROAD `-scan_order_solver SCANOPT` (pass-through to
    `set_dft_config -scanopt_seed`).
  default: 1
  stages:
    - floorplan
    - grt
DFT_SCANOPT_TIME_LIMIT:
  description: >
    Total time budget (seconds) for OpenROAD in-tree scan ordering (`ILS`)
    (pass-through to `set_dft_config -scanopt_time_limit`). OpenROAD splits this
    budget across all scan chains to keep total runtime bounded as chain count
    increases. `0` means unlimited. Note: UCLA `SCANOPT` does not currently
    honor this time limit for `PLACEMENT`.
  default: 300
  stages:
    - floorplan
    - grt
DFT_SCANOPT_TEMP_CONTROL:
  description: >
    Enable ScanOpt temperature control (optional uphill-move acceptance) for
    OpenROAD `-scan_order_solver SCANOPT` (pass-through to `set_dft_config
    -scanopt_temp_control`). When enabled, ScanOpt may accept a worse move with
    probability `exp(-Δ/temperature)` to escape local minima; use
    `DFT_SCANOPT_SEED` for reproducibility.
  stages:
    - floorplan
    - grt
DFT_SCANOPT_T_DIV:
  description: >
    Temperature divisor for ScanOpt temp control (pass-through to
    `set_dft_config -scanopt_t_div`). Larger values reduce uphill acceptance.
  stages:
    - floorplan
    - grt
DFT_VERTICAL_WEIGHT:
  description: >
    Preferred-direction tuning for scan ordering. Vertical movement is weighted
    by this factor relative to horizontal. Pass-through to `set_dft_config
    -vertical_weight`.
  default: 1.0
  stages:
    - floorplan
    - grt
DFT_BLOCKAGE_WEIGHT:
  description: >
    Blockage-aware scan ordering penalty weight. Adds an estimated detour cost
    when a straight rectilinear scan connection would cross hard macros /
    placement blockages. Pass-through to `set_dft_config -blockage_weight`.
  default: 1.0
  stages:
    - floorplan
    - grt
DFT_MAX_IMBALANCE:
  description: >
    Maximum allowed chain-length imbalance (percent). Pass-through to
    `set_dft_config -max_imbalance`.
  default: 2
  stages:
    - floorplan
    - grt
DFT_USE_EXISTING_SCAN_CHAINS:
  description: >
    When set, pass-through to `set_dft_config -use_existing_scan_chains` so
    OpenROAD uses scan chains already stored in ODB (for example imported via
    `read_def -incremental` from a SCANDEF/DEF `SCANCHAINS` section) as the plan
    for `report_dft_plan` and `execute_dft_plan`.
  default: 0
  stages:
    - floorplan
    - grt
DFT_IMPORT_SCANDEF_FILE:
  description: >
    Optional path to a SCANDEF/DEF file containing a `SCANCHAINS` section to
    import via `read_def -incremental`. Used with
    `DFT_USE_EXISTING_SCAN_CHAINS=1` to stitch in a user-defined scan order.
  stages:
    - floorplan
    - grt
DFT_SPLIT_MULTIBIT_SCAN_CELLS:
  description: >
    When set, pass-through to `set_dft_config -split_multibit_scan_cells` so
    scan cells with multiple external scan-in/out pairs (e.g. `SI[0..]`/`SO[0..]`)
    are split into multiple scan elements during planning/stitching.
  default: 0
  stages:
    - floorplan
    - grt
DFT_ERROR_ON_POWER_DOMAIN_CROSSINGS:
  description: >
    When set, pass-through to `set_dft_config -error_on_power_domain_crossings`
    so power-domain crossing checks (voltage mismatch, switched domains, or
    incomplete assignments) fail instead of warning.
  default: 0
  stages:
    - floorplan
    - grt
DFT_SCAN_ORDER_CONSTRAINTS_FILE:
  description: >
    Optional scan ordering constraints file (ScanOpt-style). Directives:
    `default_priority <0..127>`, `group [<name>] [<priority>] <inst|group...>`,
    `path [<name>] [<priority>] inst0 inst1 ...`, `fixed_edge <instA> <instB>`,
    `before <inst|group> <inst|group>`, `chain <name> [begin <x> <y>|<port|inst/pin>]
    [end <x> <y>|<port|inst/pin>]`, `assign <chain> <inst|group...>`,
    `exclude <inst|group...>`.
  stages:
    - floorplan
    - grt
DFT_TIMING_SETUP_WEIGHT:
  description: >
    Timing-aware scan ordering penalty weight for setup slack at the source
    scan-out pin. Pass-through to `set_dft_config -timing_setup_weight`.
  stages:
    - floorplan
    - grt
  default: 0
DFT_TIMING_HOLD_WEIGHT:
  description: >
    Timing-aware scan ordering penalty weight for hold slack at the source
    scan-out pin. Pass-through to `set_dft_config -timing_hold_weight`.
  stages:
    - floorplan
    - grt
  default: 0
DFT_TIMING_CRITICAL_SLACK:
  description: >
    Slack threshold used by OpenROAD timing-aware scan ordering. `0` means only
    negative slack is considered critical. Pass-through to `set_dft_config
    -timing_critical_slack`.
  stages:
    - floorplan
    - grt
  default: 0
DFT_EXCLUDE_SHIFT_REGISTERS:
  description: >
    Automatically detect simple functional shift-register chains (direct Q→D) and
    exclude them from scan_replace and scan planning. Pass-through to OpenROAD
    `set_dft_config -exclude_shift_registers` (boolean).
  default: 0
  stages:
    - floorplan
    - grt
DFT_PREFER_QBAR:
  description: >
    Prefer using the complemented output (`QN`/`Q_N`) as scan-out when the library
    does not tag a scan-out port (can reduce added load on functional `Q` nets, at
    the cost of introducing inversion in the scan path). Pass-through to OpenROAD
    `set_dft_config -prefer_qbar` (boolean).
  default: 0
  stages:
    - floorplan
    - grt
DFT_SHIFT_REGISTER_MIN_LENGTH:
  description: >
    Minimum chain length to classify as a shift register when
    `DFT_EXCLUDE_SHIFT_REGISTERS=1`. Pass-through to OpenROAD
    `set_dft_config -shift_register_min_length` (must be `>= 2`).
  default: 4
  stages:
    - floorplan
    - grt
DFT_INSERT_LOCKUP:
  description: >
    Force lockup insertion during scan stitching. Pass-through to
    `set_dft_config -insert_lockup` (boolean). Note: when
    `DFT_CLOCK_MIXING=clock_mix`, OpenROAD requires lockup insertion for domain
    crossings; you must configure lockup cells/pins.
  stages:
    - floorplan
    - grt
DFT_LOCKUP_CELL_RISING:
  description: >
    Lockup latch master cell used when the destination scan flop is rising-edge
    triggered. Pass-through to `set_dft_config -lockup_cell_rising`.
  stages:
    - floorplan
    - grt
DFT_LOCKUP_CELL_FALLING:
  description: >
    Lockup latch master cell used when the destination scan flop is falling-edge
    triggered. Pass-through to `set_dft_config -lockup_cell_falling`.
  stages:
    - floorplan
    - grt
DFT_LOCKUP_IN_PIN:
  description: >
    Lockup latch data-in pin name. Pass-through to `set_dft_config -lockup_in_pin`.
  default: D
  stages:
    - floorplan
    - grt
DFT_LOCKUP_OUT_PIN:
  description: >
    Lockup latch data-out pin name. Pass-through to `set_dft_config -lockup_out_pin`.
  default: Q
  stages:
    - floorplan
    - grt
DFT_LOCKUP_CLOCK_PIN_RISING:
  description: >
    Lockup latch clock pin name when the destination scan flop is rising-edge
    triggered. Pass-through to `set_dft_config -lockup_clock_pin_rising`.
  stages:
    - floorplan
    - grt
DFT_LOCKUP_CLOCK_PIN_FALLING:
  description: >
    Lockup latch clock pin name when the destination scan flop is falling-edge
    triggered. Pass-through to `set_dft_config -lockup_clock_pin_falling`.
  stages:
    - floorplan
    - grt
DFT_TIMING_BUFFER_CELL:
  description: >
    Optional buffer master cell used on timing-critical scan links (between scan
    flops in the same clock domain). Pass-through to `set_dft_config
    -timing_buffer_cell`.
  stages:
    - floorplan
    - grt
DFT_TIMING_BUFFER_IN_PIN:
  description: >
    Timing buffer input pin name. Pass-through to `set_dft_config -timing_buffer_in_pin`.
  default: A
  stages:
    - floorplan
    - grt
DFT_TIMING_BUFFER_OUT_PIN:
  description: >
    Timing buffer output pin name. Pass-through to `set_dft_config -timing_buffer_out_pin`.
  default: X
  stages:
    - floorplan
    - grt
DFT_SCAN_ENABLE_NAME_PATTERN:
  description: >
    Pattern used by OpenROAD DFT to find or create the scan-enable driver during stitching
    (pass-through to `set_dft_config -scan_enable_name_pattern`). Supports an optional `{}`
    placeholder; for scan-enable, OpenROAD replaces it with `0`. If the pattern contains
    an unescaped `/`, OpenROAD interprets it as `instance/pin` instead of a top-level port.
  default: scan_enable_{}
  stages:
    - floorplan
    - grt
DFT_SCAN_IN_NAME_PATTERN:
  description: >
    Pattern used by OpenROAD DFT to find or create scan-in drivers during stitching
    (pass-through to `set_dft_config -scan_in_name_pattern`). Supports an optional `{}`
    placeholder, replaced by the chain ordinal starting at `0`. If the pattern contains
    an unescaped `/`, OpenROAD interprets it as `instance/pin` instead of a top-level port.
  default: scan_in_{}
  stages:
    - floorplan
    - grt
DFT_SCAN_OUT_NAME_PATTERN:
  description: >
    Pattern used by OpenROAD DFT to find or create scan-out loads during stitching
    (pass-through to `set_dft_config -scan_out_name_pattern`). Supports an optional `{}`
    placeholder, replaced by the chain ordinal starting at `0`. If the pattern contains
    an unescaped `/`, OpenROAD interprets it as `instance/pin` instead of a top-level port.
  default: scan_out_{}
  stages:
    - floorplan
    - grt
DFT_DEFER_STITCH:
  description: >
    When set, skip stitching in `PRE_GLOBAL_ROUTE_TCL` so stitching can be run in
    `POST_GLOBAL_ROUTE_TCL` (useful for routing-aware ordering).
  default: 0
  stages:
    - grt
DFT_PLACE_SCAN_PORTS:
  description: >
    When enabled, re-place `scan_in_N`/`scan_out_N` ports near their chain endpoints
    before stitching (helps multi-chain QoR). When unset, ORFS enables it by default
    when multi-chain is configured.
  stages:
    - grt
DFT_PLACE_SCAN_ENABLE_PORT:
  description: >
    When enabled, also re-place `scan_enable_0` (defaults to `DFT_PLACE_SCAN_PORTS`
    when set).
  stages:
    - grt
DFT_DONT_TOUCH_SCAN_NETS:
  description: >
    Mark scan-only nets as `dont_touch` to avoid QoR-driven optimization on scan-only
    nets (scan_enable tree remains optimizable). Applies after stitching.
  default: 1
  stages:
    - grt
DFT_BUFFER_SCAN_ENABLE:
  description: >
    Buffer/split `scan_enable_0` to reduce fanout before routing (applies after stitching).
  default: 1
  stages:
    - grt
DFT_SCAN_ENABLE_MAX_FANOUT:
  description: >
    Max fanout per buffered `scan_enable_0` branch when `DFT_BUFFER_SCAN_ENABLE=1`.
  default: 64
  stages:
    - grt
DFT_SCAN_ENABLE_BUFFER_CELL:
  description: >
    Buffer cell to use for `scan_enable_0` buffering (defaults to `MIN_BUF_CELL_AND_PORTS[0]`).
  stages:
    - grt
DFT_SCAN_ENABLE_BUFFER_LEVELS:
  description: >
    Max buffering levels for `scan_enable_0` buffering.
  default: 3
  stages:
    - grt
DFT_SCAN_SOLVER:
  description: >
    Solver used for ordering scan cells within each chain. `openroad` uses OpenROAD's
    built-in heuristic. `scanopt_next` uses ORFS' bundled reference solver (or an external
    binary via `DFT_SCAN_SOLVER_BIN`). `order_file` uses an explicit per-chain ordering from
    `DFT_SCAN_ORDER_FILE`.
  default: openroad
  stages:
    - grt
DFT_SCAN_ORDER_FILE:
  description: >
    When `DFT_SCAN_SOLVER=order_file`, path to a whitespace-separated order file describing
    the exact per-chain scan ordering. Format: `chain_name inst0 inst1 ...` (one chain per
    line). For single-chain designs, a single line `inst0 inst1 ...` is also accepted.
  stages:
    - grt
DFT_SCAN_SOLVER_BIN:
  description: >
    Optional path to an external scan ordering solver. When set and `DFT_SCAN_SOLVER=scanopt_next`,
    ORFS invokes this binary instead of the bundled `flow/util/scan_opt_next.py`. The binary must
    accept `--input <tsv>` and `--output <path>`.
  stages:
    - grt
DFT_SCAN_SOLVER_ARGS:
  description: >
    Extra arguments (as a whitespace-separated list) passed to the scan solver invocation.
  stages:
    - grt
DFT_SCAN_SOLVER_SEED:
  description: >
    Random seed passed to the scan solver (when supported).
  default: 0
  stages:
    - grt
DFT_SCAN_SOLVER_MAX_2OPT_ITERS:
  description: >
    Max 2-opt iterations for the bundled `scanopt_next` solver (tuning knob).
  default: 20000
  stages:
    - grt
DFT_SCAN_SOLVER_DISABLE_2OPT:
  description: >
    Disable 2-opt refinement in the bundled `scanopt_next` solver.
  default: 0
  stages:
    - grt
DFT_LOCKUP_POLICY:
  description: >
    Policy when `clock_mix` produces mixed-clock/edge chains. `auto` (default)
    re-runs planning with `no_mix` (avoids needing lockup cells). `warn` keeps
    `clock_mix` but prints a warning (stitching will fail unless lockup cells
    are configured). `error` fails early. `off` skips the check entirely.
  default: auto
  stages:
    - grt
DFT_REPORT_SCAN_WIRELENGTH:
  description: >
    Emit scan wirelength report files and scan-chain cost metrics (placement
    proxy) in the pre-global-route and final stages.
  default: 1
  stages:
    - grt
    - final
DFT_WRITE_SCANDEF:
  description: >
    Export a SCANDEF/DEF-style `SCANCHAINS` section to a standalone file in the
    final stage (calls `write_scandef -file ...` in OpenROAD).
  default: 0
  stages:
    - final
DFT_SCANDEF_FILE:
  description: >
    Output path for the SCANDEF file when `DFT_WRITE_SCANDEF=1` (defaults to
    `$RESULTS_DIR/6_final.scandef`).
  stages:
    - final
POST_GLOBAL_ROUTE_TCL:
  description: |
    Specifies a Tcl script with commands to run after the initial global route
    completes (before repair_design / repair_timing).
  stages:
    - grt
FASTROUTE_TCL:
  description: |
    Specifies a Tcl script with commands to run before FastRoute.
USE_FILL:
  description: >
    Whether to perform metal density filling.
  default: 0
SEAL_GDS:
  description: |
    Seal macro to place around the design.
ABSTRACT_SOURCE:
  description: |
    Which .odb file to use to create abstract
  stages:
    - generate_abstract
PRE_GLOBAL_ROUTE_TCL:
  description: |
    Specifies a Tcl script with commands to run before global route.
  stages:
    - grt
GLOBAL_ROUTE_ARGS:
  description: >
    Replaces default arguments for global route.
  stages:
    - grt
  default: -congestion_iterations 30 -congestion_report_iter_step 5 -verbose
MATCH_CELL_FOOTPRINT:
  description: >
    Enforce sizing operations to only swap cells that have the same layout
    boundary.
  stages:
    - floorplan
    - place
    - cts
    - route
  default: 0
RTLMP_MAX_LEVEL:
  description: >
    Maximum depth of the physical hierarchy tree.
  default: 2
  stages:
    - floorplan
RTLMP_MAX_INST:
  description: >
    Maximum number of standard cells in a cluster. If unset, rtl_macro_placer
    will calculate a value based on the design attributes.
  stages:
    - floorplan
RTLMP_MIN_INST:
  description: >
    Minimum number of standard cells in a cluster. If unset, rtl_macro_placer
    will calculate a value based on the design attributes.
  stages:
    - floorplan
RTLMP_MAX_MACRO:
  description: >
    Maximum number of macros in a cluster. If unset, rtl_macro_placer will
    calculate a value based on the design attributes.
  stages:
    - floorplan
RTLMP_MIN_MACRO:
  description: >
    Minimum number of macros in a cluster. If unset, rtl_macro_placer will
    calculate a value based on the design attributes.
  stages:
    - floorplan
RTLMP_MIN_AR:
  description: >
    Specifies the minimum aspect ratio (height/width).
  default: 0.33
  stages:
    - floorplan
RTLMP_AREA_WT:
  description: >
    Weight for the area of the current floorplan.
  default: 0.1
  stages:
    - floorplan
RTLMP_WIRELENGTH_WT:
  description: >
    Weight for half-perimiter wirelength.
  default: 100.0
  stages:
    - floorplan
RTLMP_OUTLINE_WT:
  description: >
    Weight for violating the fixed outline constraint, meaning that all
    clusters should be placed within the shape of their parent cluster.
  default: 100.00
  stages:
    - floorplan
RTLMP_BOUNDARY_WT:
  description: >
    Weight for the boundary or how far the hard macro clusters are from
    boundaries.
  default: 50.0
  stages:
    - floorplan
RTLMP_NOTCH_WT:
  description: >
    Weight for the notch, or the existence of dead space that cannot be used
    for placement and routing.
  default: 10.0
  stages:
    - floorplan
RTLMP_DEAD_SPACE:
  description: >
    Specifies the target dead space percentage, which influences the
    utilization of a cluster.
  default: 0.05
  stages:
    - floorplan
RTLMP_RPT_DIR:
  description: >
    Path to the directory where reports are saved.
  stages:
    - floorplan
RTLMP_FENCE_LX:
  description: >
    Defines the lower left X coordinate for the global fence bounding box in
    microns.
  default: 0.0
  stages:
    - floorplan
RTLMP_FENCE_LY:
  description: >
    Defines the lower left Y coordinate for the global fence bounding box in
    microns.
  default: 0.0
  stages:
    - floorplan
RTLMP_FENCE_UX:
  description: >
    Defines the upper right X coordinate for the global fence bounding box in
    microns.
  default: 0.0
  stages:
    - floorplan
RTLMP_FENCE_UY:
  description: >
    Defines the upper right Y coordinate for the global fence bounding box in
    microns.
  default: 0.0
  stages:
    - floorplan
RTLMP_ARGS:
  description: >
    Overrides all other RTL macro placer arguments.
  stages:
    - floorplan
GDS_ALLOW_EMPTY:
  description: >
    Regular expression of module names of macros that have no .gds file
  stages:
    - final
RUN_SCRIPT:
  description: >
    Path to script to run from `make run`, python or tcl script detected by
    .py or .tcl extension.
RUN_LOG_NAME_STEM:
  description: >
    Stem of the log file name, the log file will be named
    `$(LOG_DIR)/$(RUN_LOG_NAME_STEM).log`.
  default: run
YOSYS_FLAGS:
  description: >
    Flags to pass to yosys.
  stages:
    - synth
  default: -v 3
FOOTPRINT:
  description: |
    Custom footprint definition file for ICeWall-based floorplan initialization. Mutually exclusive with FLOORPLAN_DEF or DIE_AREA/CORE_AREA or CORE_UTILIZATION.
  stages:
    - floorplan
FOOTPRINT_TCL:
  description: |
    Specifies a Tcl script with custom footprint-related commands for floorplan setup.
  stages:
    - floorplan
FLOW_VARIANT:
  description: >
    Flow variant to use, used in the flow variant directory name.
  default: base
RULES_JSON:
  description: >
    json files with the metrics baseline regression rules.
    In the ORFS Makefile, this defaults to $DESIGN_DIR/rules-base.json,
    but ORFS does not mandate the users source directory layout and
    this can be placed elsewhere when the user sets up an ORFS
    config.mk or from bazel-orfs.
  stages:
    - test
SKIP_ANTENNA_REPAIR_PRE_GRT:
  default: 0
  description: >
    Skips antenna repair pre-global routing.
  stages:
    - grt
SKIP_ANTENNA_REPAIR_POST_DRT:
  default: 0
  description: >
    Skips antenna repair post-detailed routing.
  stages:
    - route
SKIP_ANTENNA_REPAIR:
  default: 0
  description: >
    Skips antenna repair entirely.
  stages:
    - grt
SKIP_DETAILED_ROUTE:
  default: 0
  description: >
    Skips detailed route.
  stages:
    - route
    - final
MAX_REPAIR_ANTENNAS_ITER_DRT:
  default: 5
  description: >
    Defines the maximum number of iterations post-detailed routing repair
    antennas will run.
  stages:
    - route
MAX_REPAIR_ANTENNAS_ITER_GRT:
  default: 5
  description: >
    Defines the maximum number of iterations post global routing repair
    antennas will run.
  stages:
    - grt
OPENROAD_HIERARCHICAL:
  description: >
    Feature toggle to enable to run OpenROAD in hierarchical mode,
    otherwise considered flat. Will eventually be the default and
    this option will be retired.
  default: 0
  stages:
    - All stages
MAX_REPAIR_TIMING_ITER:
  description: >
    Maximum number of iterations for repair setup and repair hold.
  stages:
    - cts
    - floorplan
    - grt
    - place
NUM_CORES:
  description: >
    Passed to `openroad -threads $(NUM_CORES)`, defaults to numbers
    of cores in system as determined by system specific code in Makefile,
    `nproc` is tried first.

    OpenROAD does not limit itself to this number of cores across
    OpenROAD running instances, which can lead to overprovisioning
    in contexts such as bazel-orfs where there could be many
    routing, or place jobs running at the same time.
  stages:
    - All stages
KEEP_VARS:
  description: >
    Feature toggle to keep intermediate variables during the flow.
    This is useful for the single-run flow, where all stages of the flow
    are run in a single OpenROAD instance.
  default: 0
  stages:
    - All stages
WRITE_ODB_AND_SDC_EACH_STAGE:
  description: >
    Save out .sdc and .odb file after each stage, useful to disable
    when using a single OpenROAD instance to run all stages of the flow.
  stages:
    - All stages
  default: 1
