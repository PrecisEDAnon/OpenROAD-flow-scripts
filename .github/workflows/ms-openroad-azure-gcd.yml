name: ms-openroad (Azure gcd)

on:
  push:
    branches:
      - microsoft-openroad
    paths:
      - ".dockerignore"
      - ".github/workflows/ms-openroad-azure-gcd.yml"
      - "env.sh"
      - "flow/Makefile"
      - "flow/scripts/**"
      - "flow/util/**"
      - "flow/designs/nangate45/gcd/**"
      - "flow/designs/src/gcd/**"
      - "flow/platforms/common/**"
      - "flow/platforms/nangate45/**"
      - "ms-openroad/**"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: ms-openroad-azure-gcd-${{ github.ref }}
  cancel-in-progress: true

env:
  # Azure environment (ms-openroad subscription)
  AZ_RG: orfs-rg-4bf708
  AZ_ACR_NAME: orfs4bf708
  AZ_STORAGE_ACCOUNT: orfs4bf708sa
  AZ_FILE_SHARE: orfs-share
  AZ_TELEMETRY_CONTAINER: orfs-telemetry
  AZ_IDENTITY_ID: /subscriptions/ea2e8ed3-281b-4422-a24d-41d87cd070c3/resourcegroups/orfs-rg-4bf708/providers/Microsoft.ManagedIdentity/userAssignedIdentities/orfs-aci-mi-4bf708

  # GitHub OIDC → Azure federated credential (no secrets)
  AZURE_TENANT_ID: 8a198873-4fec-4e76-8182-ca479edbbd60
  AZURE_SUBSCRIPTION_ID: ea2e8ed3-281b-4422-a24d-41d87cd070c3
  AZURE_CLIENT_ID: b6b68521-9572-49e8-8dd7-0cacad242f24

  # Flow defaults
  IMAGE_REPO: orfs-flow
  DESIGN: gcd
  PLATFORM: nangate45
  FLOW_VARIANT: base
  CPU: "4"
  MEMORY_GB: "16"
  SKIP_CTS_REPAIR_TIMING: "1"

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR from this branch
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          image_tag="sha-${short_sha}"
          context_url="https://github.com/${GITHUB_REPOSITORY}.git#${GITHUB_REF_NAME}"

          echo "ACR build:"
          echo "  registry=${AZ_ACR_NAME}"
          echo "  context=${context_url}"
          echo "  dockerfile=ms-openroad/Dockerfile"
          echo "  tags=${IMAGE_REPO}:microsoft-openroad, ${IMAGE_REPO}:${image_tag}"

          az acr build \
            --resource-group "${AZ_RG}" \
            --registry "${AZ_ACR_NAME}" \
            --file ms-openroad/Dockerfile \
            --image "${IMAGE_REPO}:microsoft-openroad" \
            --image "${IMAGE_REPO}:${image_tag}" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --build-arg "BASE_IMAGE=openroad/orfs:latest" \
            "${context_url}"

      - name: Run nangate45/gcd on Azure Container Instances
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::12}"
          image_tag="sha-${short_sha}"
          acr_login_server="$(az acr show -n "${AZ_ACR_NAME}" --query loginServer -o tsv)"
          image_fqn="${acr_login_server}/${IMAGE_REPO}:${image_tag}"

          run_id="${DESIGN}-${short_sha}-${GITHUB_RUN_ID}"
          work_home="/work/${run_id}"

          aci_name_raw="orfs-${run_id}"
          aci_name="$(echo "${aci_name_raw}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-' | cut -c1-63 | sed 's/^-//; s/-$//')"

          storage_key="$(az storage account keys list \
            --account-name "${AZ_STORAGE_ACCOUNT}" \
            --resource-group "${AZ_RG}" \
            --query '[0].value' -o tsv)"

          echo "ACI run:"
          echo "  rg=${AZ_RG}"
          echo "  name=${aci_name}"
          echo "  image=${image_fqn}"
          echo "  cpu=${CPU} memory_gb=${MEMORY_GB}"
          echo "  work_home=${work_home}"

          az container create \
            --resource-group "${AZ_RG}" \
            --name "${aci_name}" \
            --image "${image_fqn}" \
            --os-type Linux \
            --restart-policy Never \
            --cpu "${CPU}" \
            --memory "${MEMORY_GB}" \
            --assign-identity "${AZ_IDENTITY_ID}" \
            --acr-identity "${AZ_IDENTITY_ID}" \
            --azure-file-volume-account-name "${AZ_STORAGE_ACCOUNT}" \
            --azure-file-volume-account-key "${storage_key}" \
            --azure-file-volume-share-name "${AZ_FILE_SHARE}" \
            --azure-file-volume-mount-path /work \
            --command-line "/usr/local/bin/run-orfs.sh" \
            --environment-variables \
              DESIGN="${DESIGN}" \
              PLATFORM="${PLATFORM}" \
              FLOW_VARIANT="${FLOW_VARIANT}" \
              WORK_HOME="${work_home}" \
              NPROC="${CPU}" \
              SKIP_CTS_REPAIR_TIMING="${SKIP_CTS_REPAIR_TIMING}" \
            1>/dev/null

          echo "Waiting for completion..."
          exit_code=""
          while true; do
            read -r group_state container_state exit_code < <(az container show \
              --resource-group "${AZ_RG}" \
              --name "${aci_name}" \
              --query '{g:instanceView.state, c:containers[0].instanceView.currentState.state, e:containers[0].instanceView.currentState.exitCode}' \
              -o tsv)

            if [[ "${exit_code:-}" == "None" ]]; then
              exit_code=""
            fi

            echo "  group=${group_state} container=${container_state} exitCode=${exit_code:-}"

            if [[ "${container_state}" == "Terminated" || "${group_state}" == "Failed" || "${group_state}" == "Succeeded" || "${group_state}" == "Terminated" || "${group_state}" == "Stopped" ]]; then
              break
            fi
            sleep 20
          done

          echo ""
          echo "Logs:"
          az container logs --resource-group "${AZ_RG}" --name "${aci_name}" || true

          if [[ -z "${exit_code:-}" ]]; then
            exit_code="$(az container show --resource-group "${AZ_RG}" --name "${aci_name}" --query 'containers[0].instanceView.currentState.exitCode' -o tsv 2>/dev/null || true)"
          fi
          exit_code="${exit_code:-0}"

          echo ""
          echo "Artifacts are in Azure Files share '${AZ_FILE_SHARE}' under: ${run_id}/"

          if [[ "${exit_code}" != "0" ]]; then
            echo "ERROR: container exited with code ${exit_code}" >&2
            exit "${exit_code}"
          fi

      - name: Upload RunRecord to Azure Blob (RunRecord.v1)
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::12}"
          image_tag="sha-${short_sha}"
          run_id="${DESIGN}-${short_sha}-${GITHUB_RUN_ID}"
          benchmark_id="${PLATFORM}-${DESIGN}-${FLOW_VARIANT}"

          storage_key="$(az storage account keys list \
            --account-name "${AZ_STORAGE_ACCOUNT}" \
            --resource-group "${AZ_RG}" \
            --query '[0].value' -o tsv)"

          az storage container create \
            --name "${AZ_TELEMETRY_CONTAINER}" \
            --account-name "${AZ_STORAGE_ACCOUNT}" \
            --account-key "${storage_key}" \
            1>/dev/null

          tmp_dir="$(mktemp -d)"

          # Pull the minimal set of artifacts needed for telemetry.
          az storage file download \
            --account-name "${AZ_STORAGE_ACCOUNT}" \
            --account-key "${storage_key}" \
            --share-name "${AZ_FILE_SHARE}" \
            --path "${run_id}/ms-openroad-metadata.txt" \
            --dest "${tmp_dir}/ms-openroad-metadata.txt" \
            -o none

          az storage file download \
            --account-name "${AZ_STORAGE_ACCOUNT}" \
            --account-key "${storage_key}" \
            --share-name "${AZ_FILE_SHARE}" \
            --path "${run_id}/reports/${PLATFORM}/${DESIGN}/${FLOW_VARIANT}/6_finish.rpt" \
            --dest "${tmp_dir}/6_finish.rpt" \
            -o none

          az storage file download \
            --account-name "${AZ_STORAGE_ACCOUNT}" \
            --account-key "${storage_key}" \
            --share-name "${AZ_FILE_SHARE}" \
            --path "${run_id}/reports/${PLATFORM}/${DESIGN}/${FLOW_VARIANT}/synth_stat.txt" \
            --dest "${tmp_dir}/synth_stat.txt" \
            -o none

          rg_location="$(az group show -n "${AZ_RG}" --query location -o tsv)"

          # Best-effort: resolve the image digest for the tag we just built.
          image_digest="$(az acr repository show-manifests \
            -n "${AZ_ACR_NAME}" \
            --repository "${IMAGE_REPO}" \
            --query "[?contains(tags, '${image_tag}')].digest | [0]" \
            -o tsv 2>/dev/null || true)"

          export tmp_dir run_id benchmark_id image_tag image_digest rg_location
          python3 - <<'PYPARSE'
          import json
          import os
          import re
          from pathlib import Path

          tmp_dir = Path(os.environ['tmp_dir'])

          def parse_kv_file(p: Path):
            out = {}
            for line in p.read_text().splitlines():
              line = line.strip()
              if not line or '=' not in line:
                continue
              k, v = line.split('=', 1)
              out[k.strip()] = v.strip()
            return out

          def find_float(pattern: str, text: str):
            m = re.search(pattern, text, flags=re.MULTILINE)
            return float(m.group(1)) if m else None

          def find_int(pattern: str, text: str):
            m = re.search(pattern, text, flags=re.MULTILINE)
            return int(m.group(1)) if m else None

          meta = parse_kv_file(tmp_dir / 'ms-openroad-metadata.txt')
          finish = (tmp_dir / '6_finish.rpt').read_text(errors='replace')
          synth = (tmp_dir / 'synth_stat.txt').read_text(errors='replace')

          tns = find_float(r'^tns max\s+(-?\d+(?:\.\d+)?)\s*$', finish)
          wns = find_float(r'^wns max\s+(-?\d+(?:\.\d+)?)\s*$', finish)
          worst_slack = find_float(r'^worst slack max\s+(-?\d+(?:\.\d+)?)\s*$', finish)

          clk = re.search(r'^(\S+)\s+period_min\s*=\s*(\d+(?:\.\d+)?)\s+fmax\s*=\s*(\d+(?:\.\d+)?)\s*$', finish, flags=re.MULTILINE)
          clock_name = clk.group(1) if clk else None
          period_min = float(clk.group(2)) if clk else None
          fmax_mhz = float(clk.group(3)) if clk else None

          setup_skew = find_float(r'^\s*(-?\d+(?:\.\d+)?)\s+setup skew\s*$', finish)

          viol = {
            'max_slew': find_int(r'^max slew violation count\s+(\d+)\s*$', finish),
            'max_fanout': find_int(r'^max fanout violation count\s+(\d+)\s*$', finish),
            'max_cap': find_int(r'^max cap violation count\s+(\d+)\s*$', finish),
            'setup': find_int(r'^setup violation count\s+(\d+)\s*$', finish),
            'hold': find_int(r'^hold violation count\s+(\d+)\s*$', finish),
          }

          total_power_w = None
          m = re.search(r'^Total\s+\S+\s+\S+\s+\S+\s+(\S+)\s+\S+\s*$', finish, flags=re.MULTILINE)
          if m:
            try:
              total_power_w = float(m.group(1))
            except ValueError:
              total_power_w = None

          # synth_stat has a line like: "501  639.198 cells"
          synth_cells = None
          synth_area = None
          m = re.search(r'^\s*(\d+)\s+(\d+(?:\.\d+)?)\s+cells\s*$', synth, flags=re.MULTILINE)
          if m:
            synth_cells = int(m.group(1))
            synth_area = float(m.group(2))

          run_record = {
            'schema': 'RunRecord.v1',
            # IDs
            'run_id': os.environ['run_id'],
            'benchmark_id': os.environ['benchmark_id'],
            # Repro
            'git_sha': os.environ['GITHUB_SHA'],
            'image_repo': os.environ['IMAGE_REPO'],
            'image_tag': os.environ['image_tag'],
            'image_digest': os.environ.get('image_digest') or None,
            # Azure
            'azure': {
              'subscription_id': os.environ.get('AZURE_SUBSCRIPTION_ID'),
              'resource_group': os.environ.get('AZ_RG'),
              'location': os.environ.get('rg_location'),
              'storage_account': os.environ.get('AZ_STORAGE_ACCOUNT'),
              'file_share': os.environ.get('AZ_FILE_SHARE'),
              'telemetry_container': os.environ.get('AZ_TELEMETRY_CONTAINER'),
            },
            # GitHub
            'github': {
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'repository': os.environ.get('GITHUB_REPOSITORY'),
              'ref': os.environ.get('GITHUB_REF_NAME'),
            },
            # Flow identity
            'design': meta.get('design'),
            'platform': meta.get('platform'),
            'flow_variant': meta.get('flow_variant'),
            'design_config': meta.get('design_config'),
            'timestamp_utc': meta.get('timestamp_utc'),
            # System (requested)
            'system': {
              'cpu': int(os.environ.get('CPU', '0') or 0) or None,
              'memory_gb': float(os.environ.get('MEMORY_GB', '0') or 0) or None,
            },
            # QoR
            'qor': {
              'tns_ns': tns,
              'wns_ns': wns,
              'worst_slack_ns': worst_slack,
              'clock_name': clock_name,
              'period_min_ns': period_min,
              'fmax_mhz': fmax_mhz,
              'setup_skew_ns': setup_skew,
              'total_power_w': total_power_w,
              'violations': viol,
              'synth_cells': synth_cells,
              'synth_area': synth_area,
            },
          }

          out_path = tmp_dir / 'run_record.json'
          out_path.write_text(json.dumps(run_record, indent=2, sort_keys=True) + '\n')
          print('Wrote', out_path)
          PYPARSE

          date_prefix="$(date -u +%Y/%m/%d)"
          blob_name="runs/${date_prefix}/benchmark_id=${benchmark_id}/run_id=${run_id}/run_record.json"

          az storage blob upload \
            --overwrite \
            --account-name "${AZ_STORAGE_ACCOUNT}" \
            --account-key "${storage_key}" \
            --container-name "${AZ_TELEMETRY_CONTAINER}" \
            --name "${blob_name}" \
            --file "${tmp_dir}/run_record.json" \
            -o none

          echo "Uploaded telemetry: ${AZ_TELEMETRY_CONTAINER}/${blob_name}"
